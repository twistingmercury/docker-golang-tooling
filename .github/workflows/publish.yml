name: Publish Image

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  BASE_IMAGE: golang:alpine

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GHCR token
        shell: bash
        run: |
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "GHCR_PAT secret is required and must include write:packages scope."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          owner_lc="${GITHUB_REPOSITORY_OWNER,,}"
          image_name="ghcr.io/${owner_lc}/golang-tooling"

          docker pull "${BASE_IMAGE}"
          go_version_raw="$(docker run --rm "${BASE_IMAGE}" go env GOVERSION)"
          go_version="${go_version_raw#go}"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "go_version_raw=${go_version_raw}" >> "$GITHUB_OUTPUT"
          echo "go_version=${go_version}" >> "$GITHUB_OUTPUT"
          echo "build_date=${build_date}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:alpine
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.go_version_raw }}-alpine
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.go_version }}
